<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
    <nav th:fragment="navbar(paginaActiva)" class="navbar navbar-expand-lg navbar-utp px-4 py-3 mb-5">
        <a class="navbar-brand fw-bold" th:href="${session.rol == 'CLIENTE'} ? @{/operacion} : @{/}">
            <i class="bi bi-shield-lock-fill text-danger"></i> LAMBDA SHIELD
        </a>
        <div th:if="${session.rol == 'CLIENTE'}" class="dropdown ms-auto me-2 order-lg-3 notificaciones" id="centroNotificaciones">
            <button class="boton-campana" type="button" id="btnNotificaciones" data-bs-toggle="dropdown"
                    data-bs-auto-close="outside" aria-expanded="false" aria-controls="panelNotificaciones" aria-label="Notificaciones">
                <i class="bi bi-bell" aria-hidden="true"></i>
                <span class="contador-notificaciones" id="contadorNotificaciones" hidden aria-hidden="true">0</span>
            </button>
            <section class="dropdown-menu dropdown-menu-end panel-notificaciones" id="panelNotificaciones" aria-labelledby="btnNotificaciones">
                <div class="notificaciones-cabecera">
                    <div><h2>Notificaciones</h2><p id="resumenNotificaciones" role="status" aria-live="polite">Tus avisos de seguridad</p></div>
                    <button type="button" class="notificaciones-marcar" id="btnLeerNotificaciones" disabled title="Marcar todas como leídas" aria-label="Marcar todas como leídas">
                        <i class="bi bi-check2-all" aria-hidden="true"></i>
                    </button>
                </div>
                <div class="notificaciones-lista" id="listaNotificaciones" aria-live="polite">
                    <p class="notificaciones-vacio">Cargando tus notificaciones…</p>
                </div>
                <button type="button" class="notificaciones-mas" id="btnMasNotificaciones" hidden>Ver anteriores</button>
                <div class="notificaciones-pie" id="estadoNotificaciones">Solo tú puedes ver estos avisos.</div>
            </section>
        </div>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarContenido"
                aria-controls="navbarContenido" aria-expanded="false" aria-label="Abrir navegación">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse order-lg-2" id="navbarContenido">
            <ul class="navbar-nav me-auto ms-4">
                <!-- Enlaces para el Administrador / Analista -->
                <th:block th:if="${session.rol != 'CLIENTE'}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'inicio' ? 'active' : ''}" th:href="@{/}">Inicio</a>
                    </li>
                    <li class="nav-item" th:if="${session.rol == 'ADMIN'}">
                        <a class="nav-link" th:classappend="${paginaActiva == 'simulador' ? 'active' : ''}" th:href="@{/simulador}">Simulador</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'transacciones' ? 'active' : ''}" th:href="@{/transacciones}">Transacciones</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'reglas' ? 'active' : ''}" th:href="@{/reglas}">Motor de Reglas</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'reportes' ? 'active' : ''}" th:href="@{/reportes}">
                            <i class="bi bi-file-earmark-bar-graph"></i> Reportes
                        </a>
                    </li>
                    <li class="nav-item" th:if="${session.rol == 'ADMIN'}">
                        <a class="nav-link" th:classappend="${paginaActiva == 'usuarios' ? 'active' : ''}" th:href="@{/usuarios}">
                            <i class="bi bi-people-fill"></i> Usuarios
                        </a>
                    </li>
                </th:block>

                <!-- Enlaces para el Usuario Estándar (Cliente) -->
                <th:block th:if="${session.rol == 'CLIENTE'}">
                    <li class="nav-item">
                        <a class="nav-link" th:classappend="${paginaActiva == 'operacion' ? 'active' : ''}" th:href="@{/operacion}">
                            <i class="bi bi-send-fill text-danger"></i> Realizar Transferencia
                        </a>
                    </li>
                </th:block>
            </ul>

            <div class="d-flex align-items-center gap-3">
                <span class="text-secondary small d-none d-md-inline" th:if="${session.nombreUsuario != null}">
                    <span class="badge me-1"
                          th:classappend="${session.rol == 'CLIENTE' ? 'bg-secondary' : 'bg-danger'}"
                          th:text="${session.rol == 'CLIENTE' ? 'Cliente' : (session.rol == 'ANALISTA' ? 'Analista' : 'Administrador')}">Admin</span>
                    <span th:text="${session.nombreUsuario}">Usuario</span>
                </span>
                <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-secundario btn-sm" id="btnCerrarSesion">
                    <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                </button>
                </form>
            </div>
        </div>
    </nav>
</body>
</html>
