# Pruebas con H2 en modo PostgreSQL.
# La aplicación de producción mantiene PostgreSQL en backend/src/main/resources/application.properties.
spring.datasource.url=jdbc:h2:mem:lambda_shield;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

app.demo.enabled=true
# Cada prueba de límites construye una ventana pequeña e independiente.
security.rate-limit.api-per-minute=10000
security.rate-limit.writes-per-minute=10000
security.rate-limit.login-per-minute=10000
security.rate-limit.assistant-per-minute=10000

# Las pruebas no usan claves ni acceso real al proveedor.
app.llm.enabled=false

# La carga ampliada se prueba explícitamente y nunca altera los fixtures base de otras suites.
app.demo.dataset.enabled=false
